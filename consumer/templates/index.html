<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Tracking Radar</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        /* BRUTALIST CSS */
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg: #E5FF00;
            --black: #0F0F0F;
            --white: #FFFFFF;
            --red: #FF3366;
            --blue: #00F0FF;
            --font: 'Space Mono', monospace;
            --border: 4px solid var(--black);
            --shadow: 8px 8px 0px var(--black);
        }

        body {
            background-color: var(--bg);
            color: var(--black);
            font-family: var(--font);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            background: var(--white);
            border: var(--border);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .status-badge {
            background: var(--blue);
            color: var(--black);
            border: 2px solid var(--black);
            padding: 8px 16px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--black);
        }

        .status-badge.disconnected {
            background: var(--red);
            color: var(--white);
        }

        main {
            flex: 1;
            display: flex;
            gap: 24px;
            min-height: 0;
        }

        #map-container {
            flex: 3;
            background: var(--white);
            border: var(--border);
            box-shadow: var(--shadow);
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        aside {
            flex: 1;
            background: var(--white);
            border: var(--border);
            box-shadow: var(--shadow);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        aside h2 {
            margin-top: 0;
            border-bottom: var(--border);
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        #log {
            flex: 1;
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        #log li {
            border-bottom: 2px dashed var(--black);
            padding: 8px 0;
        }

        #log li span.driver { font-weight: bold; color: var(--blue); background: var(--black); padding: 2px 4px;}
        #log li span.speed { font-weight: bold; color: var(--red); }

        .brutalist-select {
            background: var(--white);
            color: var(--black);
            font-family: var(--font);
            font-size: 1rem;
            font-weight: bold;
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0px var(--black);
            padding: 8px;
            margin-bottom: 20px;
            width: 100%;
            cursor: pointer;
            outline: none;
        }
        .brutalist-select:focus {
            background: var(--bg);
        }

        /* Custom Popup Brutalist Style */
        .leaflet-popup-content-wrapper {
            background: var(--white) !important;
            border: 3px solid var(--black) !important;
            border-radius: 0 !important;
            box-shadow: 6px 6px 0px var(--black) !important;
            font-family: var(--font) !important;
            color: var(--black) !important;
        }
        .leaflet-popup-tip {
            border: 3px solid var(--black) !important;
            border-top: none !important;
            border-left: none !important;
            background: var(--white) !important;
            box-shadow: 4px 4px 0px var(--black) !important;
        }
        .brutalist-popup h3 {
            margin: 0 0 8px 0;
            text-transform: uppercase;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--black);
            padding-bottom: 4px;
            background: var(--bg);
            display: inline-block;
        }
        .brutalist-popup p {
            margin: 4px 0;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .brutalist-btn {
            background: var(--bg);
            color: var(--black);
            font-family: var(--font);
            font-size: 0.9rem;
            font-weight: bold;
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0px var(--black);
            padding: 4px 8px;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }
        .brutalist-btn:active {
            box-shadow: 0px 0px 0px var(--black);
            transform: translate(4px, 4px);
        }
        .brutalist-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 15, 15, 0.8);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brutalist-modal-overlay.hidden {
            display: none;
        }
        .brutalist-modal {
            background: var(--white);
            border: 4px solid var(--black);
            box-shadow: 12px 12px 0px var(--black);
            width: 400px;
            max-width: 90%;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--black);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .modal-header h2 { margin: 0; text-transform: uppercase; font-size: 1.2rem; }
        .modal-header .brutalist-btn { width: auto; margin: 0; }
    </style>
</head>
<body>

    <header>
        <h1>Delivery Radar</h1>
        <div id="ws-status" class="status-badge disconnected">WS: Disconnected</div>
    </header>

    <main>
        <div id="map-container">
            <div id="map"></div>
        </div>
        <aside>
            <h2>Live Feed</h2>
            <select id="driver-select" class="brutalist-select">
                <option value="">-- View All Drivers --</option>
            </select>
            <ul id="log"></ul>
        </aside>
    </main>

    <div id="order-modal" class="brutalist-modal-overlay hidden">
        <div class="brutalist-modal">
            <div class="modal-header">
                <h2 id="modal-title">Order Details</h2>
                <button id="modal-close" class="brutalist-btn">X</button>
            </div>
            <div class="modal-body" id="modal-body">
                Loading...
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        // Inisialisasi Map (Pusat di Jakarta)
        const map = L.map('map').setView([-6.2088, 106.8456], 13);

        // Tile layer OSM standar, tapi difilter supaya agak grayscale/kontras tinggi
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        // Custom Driver Icon
        const driverIcon = L.icon({
            iconUrl: '/assets/car.png',
            iconSize: [40, 40], // ukuran disesuaikan
            iconAnchor: [20, 20],
            popupAnchor: [0, -20],
        });

        const markers = {}; // driver_id -> L.marker
        const wsStatus = document.getElementById('ws-status');
        const logEl = document.getElementById('log');
        const driverSelect = document.getElementById('driver-select');
        let selectedDriverId = "";

        driverSelect.addEventListener('change', (e) => {
            selectedDriverId = e.target.value;
            if (selectedDriverId && markers[selectedDriverId]) {
                const marker = markers[selectedDriverId];
                map.setView(marker.getLatLng(), 15);
                marker.openPopup();
            } else {
                const group = new L.featureGroup(Object.values(markers));
                if(Object.keys(markers).length > 0) {
                    map.fitBounds(group.getBounds().pad(0.1));
                }
            }
        });

        function ensureDriverInSelect(driverId) {
            if (!Array.from(driverSelect.options).some(opt => opt.value === driverId)) {
                const option = document.createElement('option');
                option.value = driverId;
                option.textContent = driverId;
                driverSelect.appendChild(option);
            }
        }

        function logMessage(driverId, speed) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="driver">${driverId}</span> moving at <span class="speed">${speed.toFixed(1)} km/h</span>`;
            logEl.prepend(li);
            if (logEl.children.length > 50) {
                logEl.removeChild(logEl.lastChild);
            }
        }

        // 1. Fetch initial drivers
        async function fetchInitialDrivers() {
            try {
                const res = await fetch('/track/drivers');
                const data = await res.json();
                if (data.drivers) {
                    data.drivers.forEach(d => {
                        updateMarker(d);
                    });
                    
                    // Fit bounds if there are markers
                    const group = new L.featureGroup(Object.values(markers));
                    if(Object.keys(markers).length > 0) {
                        map.fitBounds(group.getBounds().pad(0.1));
                    }
                }
            } catch (e) {
                console.error("Gagal load initial drivers:", e);
            }
        }

        function updateMarker(payload) {
            const { driver_id, order_id, latitude, longitude, speed_kmh } = payload;
            
            ensureDriverInSelect(driver_id);

            let orderBtnHTML = '';
            if (order_id) {
                orderBtnHTML = `<button class="brutalist-btn" onclick="showOrderDetails('${order_id}')">View Order Details</button>`;
            }

            const popupContent = `
                <div class="brutalist-popup">
                    <h3>${driver_id}</h3>
                    <p>Order: ${order_id || 'Idle'}</p>
                    <p>Speed: ${speed_kmh.toFixed(1)} km/h</p>
                    ${orderBtnHTML}
                </div>
            `;

            if (markers[driver_id]) {
                // Update existing marker
                const marker = markers[driver_id];
                marker.setLatLng([latitude, longitude]);
                marker.getPopup().setContent(popupContent);
            } else {
                // Create new marker
                const marker = L.marker([latitude, longitude], { icon: driverIcon }).addTo(map);
                marker.bindPopup(popupContent);
                markers[driver_id] = marker;
            }

            // Optional: follow driver if selected
            if (selectedDriverId === driver_id) {
                map.panTo([latitude, longitude], {animate: true});
            }
        }

        // 2. Setup WebSocket
        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/tracking`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                wsStatus.textContent = 'WS: Connected';
                wsStatus.classList.remove('disconnected');
            };

            ws.onmessage = (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    // Payload langsung berisi: {driver_id, order_id, latitude, longitude, ...} karena 
                    // formatnya dari schema.LocationPayload jika kita mem-broadcast record.Value
                    
                    // Kita harus decode record.Value Kafka karena formatnya EventEnvelope
                    // event_type: "driver.location.updated"
                    // payload: {driver_id, ...}
                    
                    if (payload.event_type === "driver.location.updated" && payload.payload) {
                        const loc = payload.payload;
                        updateMarker(loc);
                        logMessage(loc.driver_id, loc.speed_kmh);
                    }
                } catch (e) {
                    console.error("Error parsing WS message:", e);
                }
            };

            ws.onclose = () => {
                wsStatus.textContent = 'WS: Disconnected';
                wsStatus.classList.add('disconnected');
                setTimeout(connectWS, 2000); // Reconnect
            };
        }

        // Start
        fetchInitialDrivers().then(connectWS);

        // Modal Logic
        const modalOverlay = document.getElementById('order-modal');
        const modalBody = document.getElementById('modal-body');
        const modalTitle = document.getElementById('modal-title');
        
        document.getElementById('modal-close').addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
        });

        async function showOrderDetails(orderId) {
            modalTitle.textContent = "ORDER: " + orderId;
            modalBody.innerHTML = "Loading...";
            modalOverlay.classList.remove('hidden');

            try {
                const res = await fetch(`/track/order/${orderId}`);
                const data = await res.json();
                
                if (data.order) {
                    modalBody.innerHTML = `
                        <p><strong>Status:</strong> <span class="status-badge" style="display:inline-block; font-size:0.8rem; padding: 4px 8px; margin-left: 8px;">${data.order.current_status}</span></p>
                        <p><strong>Customer ID:</strong> ${data.order.customer_id}</p>
                        <p><strong>Driver ID:</strong> ${data.order.driver_id}</p>
                    `;
                } else {
                    modalBody.innerHTML = `<p style="color:red">Order not found.</p>`;
                }
            } catch (err) {
                modalBody.innerHTML = `<p style="color:red">Failed to fetch order details.</p>`;
            }
        }

    </script>
</body>
</html>
