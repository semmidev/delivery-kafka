# 3-broker Kafka KRaft cluster (no ZooKeeper)
# Each broker acts as both a controller and a broker (combined mode)

x-kafka-common: &kafka-common
  image: apache/kafka:4.3.0
  restart: unless-stopped
  environment: &kafka-env
    # --- KRaft: no ZooKeeper ---
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

    # --- Listeners ---
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

    # --- Replication & durability best practices ---
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_NUM_PARTITIONS: "6"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # explicit topic management only
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"

    # --- Log retention ---
    KAFKA_LOG_RETENTION_HOURS: "168" # 7 days default
    KAFKA_LOG_SEGMENT_BYTES: "1073741824" # 1 GiB segment

    # --- Performance ---
    KAFKA_NUM_IO_THREADS: "8"
    KAFKA_NUM_NETWORK_THREADS: "5"
    KAFKA_SOCKET_SEND_BUFFER_BYTES: "102400"
    KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: "102400"
    KAFKA_SOCKET_REQUEST_MAX_BYTES: "104857600"

    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk" # fixed cluster ID for all 3 brokers

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
    ports:
      - "9093:9092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
    ports:
      - "9094:9092"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - kafka-net

  # Kafbat UI for observability
  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: delivery-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux compatibility
    networks:
      - kafka-net

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

networks:
  kafka-net:
    driver: bridge
